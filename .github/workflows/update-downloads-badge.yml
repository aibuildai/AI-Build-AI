name: Update downloads badge

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history of assets/downloads.svg is the data source.
          fetch-depth: 0

      - name: Update the download history and redraw the badge and chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/download_history.py update
          python3 scripts/download_history.py render

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads.svg assets/download-history.svg assets/download-history.json assets/download-observations.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh download history"
            git push origin HEAD:main
          fi
