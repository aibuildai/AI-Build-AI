run:
  task_name: protein-ec-prediction
  # Relative paths resolve against the directory you run aibuildai FROM, so this
  # works when you run from the repository root. Use an absolute path otherwise.
  data_root: data/protein-ec-prediction
  playground_root: /path/to/playground    # where runs and outputs are written
  budget:
    wall_clock_minutes: 90

llm:
  default:
    model: claude-opus-5
  system_instructions:
    # Verbatim copy of AI-Build-AI/tasks/protein-ec-prediction.md, supplied here
    # because data_root is a plain copy of the repo data folder and carries no
    # description.md of its own.
    setup: |
      # Protein EC Number Prediction

      ## Task

      Multi-class classification: given a protein amino acid sequence, predict its EC (Enzyme Commission) class. The label is the top-level EC class (a single digit from 1–7):

      - **1** — Oxidoreductases
      - **2** — Transferases
      - **3** — Hydrolases
      - **4** — Lyases
      - **5** — Isomerases
      - **6** — Ligases
      - **7** — Translocases

      ## Data

      - `train.csv` — 6,444 labeled proteins. Columns: `Entry`, `EC class`, `Sequence`. The `EC class` column already contains the single-digit class label (1–7).
      - `test.csv` — 1,313 unlabeled proteins. Columns: `ID`, `Sequences`
      - `sample_submission.csv` — submission format. Columns: `ID`, `label`

      Class distribution in train:

      | Class | Count | Description      |
      |-------|-------|------------------|
      | 1     | 916   | Oxidoreductases  |
      | 2     | 2,544 | Transferases     |
      | 3     | 1,905 | Hydrolases       |
      | 4     | 457   | Lyases           |
      | 5     | 271   | Isomerases       |
      | 6     | 203   | Ligases          |
      | 7     | 148   | Translocases     |

      ## Output

      Produce `submission.csv` with columns:
      - **ID**: must match the `ID` column in `test.csv`
      - **label**: predicted first-level EC class (integer in {1, 2, 3, 4, 5, 6, 7})

      ## Metric

      **F1-score (macro)** across all 7 classes. Each unique first-level EC class is treated as a separate class. Higher is better.


search:
  kind: nb_tree
  parallel: 2

resources:
  work_unit:
    cpu_max_cores: 16
    memory_max_gb: 32
    by_kind:
      training: {cpu_max_cores: 24, memory_max_gb: 64}
  gpu:
    gpus_per_node: 1

work_units:
  - {kind: llm_agent, role: setup,              budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: designer,           budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: designer_evaluator, budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: coder,              budget: {kind: depth, min_minutes: 20, max_minutes: 30, scale: 2}}
  - {kind: llm_agent, role: coder_evaluator,    budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: worker,             budget: {kind: depth, min_minutes: 20, max_minutes: 30, scale: 2}}
  - {kind: llm_agent, role: reviser,            budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: reviser_evaluator,  budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: judge,              budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: selector,           budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: router,             budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: aggregator,         budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: finalizer,          budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: writer,             budget: {kind: fixed, minutes: 15}}
  - {kind: llm_agent, role: writer_evaluator,   budget: {kind: fixed, minutes: 15}}
  - {kind: node_paper,    budget: {kind: fixed, minutes: 15}}
  - {kind: score_program, budget: {kind: fixed, minutes: 5}}
  - {kind: training,      budget: {kind: expected, min_minutes: 20, max_minutes: 30, slack_fraction: 0.3}}

mcps:
  kb: all
