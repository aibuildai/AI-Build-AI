# Full fine-tune of Cosmos-Predict2.5-2B robot/action-cond on RT-1.
# Consolidated full-state-dict checkpoints are world-size agnostic, so a run
# may resume on a different number of GPUs. On resume, the expected log lines
# "resume model load: missing=0", "optimizer state resumed" and
# "EMA state resumed (N/N)" verify that all state was restored.
# The LR schedule is recomputed from this config every optimizer step (any LR
# stored in a resumed optimizer state is overwritten before the first step).
data_dir: "./data/task"  # expects train/ episodes in IRASim RT-1 format
output_dir: "./output"
resume_checkpoint: null  # path to a checkpoint_latest.pth to resume from
initial_best_metric: null            # optional prior-run full-eval PSNR guard; null = always improvable
initial_best_subset: null            # optional prior-run subset-val PSNR guard; null = always improvable
checkpoint_interval_steps: 1000      # consolidated ckpt every N optimizer steps
checkpoint_interval_seconds: 1800    # ... or every 30 min wall clock
test_mode: false                     # true = tiny capped smoke run
test_max_samples: null

# ---- FROZEN evaluation protocol (official action-conditioned inference example) ----
num_steps: 35
guidance: 0
chunk_size: 12
num_latent_conditional_frames: 1
action_scaler: 20.0                  # recorded in protocol dict of every results.json
gripper_scale: 1.0
# Fixed held-out validation episode list (excluded from training).
val_episodes: ["335", "4371", "4969", "9072", "9105", "10594", "18534", "21690",
               "26460", "31478", "33503", "35641", "45045", "50592", "51069",
               "51759", "51918", "56929", "63432", "72685", "74959", "76340",
               "78702", "79774"]

# ---- optimisation (full fine-tune) ----
learning_rate: 0.000003              # peak LR after warmup
lr_schedule_offset: 0                # >0 opens a fresh warmup+cosine window after a resume
lr_decay_steps: 3400                 # cosine decay window (optimizer steps); null = no decay
min_lr_ratio: 0.1                    # cosine floor as a fraction of peak LR
weight_decay: 0.01
warmup_steps: 50                     # linear LR warmup (optimizer steps)
batch_size: 1                        # per GPU (must be 1; scale via GPUs + grad_accum_steps)
grad_accum_steps: 1                  # effective global batch = n_gpus * grad_accum_steps
grad_clip: 1.0
gradient_checkpointing: true
sac_mode: "mm_only"
ema_decay: 0.995
seed: 42
num_workers: 2

# ---- run control ----
max_train_steps: null                # null = governed by wall-clock budget below
train_time_budget_seconds: 9600      # 2h40m of training incl. mid-run vals
val_interval_steps: 1000             # subset val every N optimizer steps
log_interval_steps: 10
run_baseline_gate: false             # zero-shot eval of the released ckpt before training
gate_episodes: 24
run_eval: true
final_eval_episodes: 24              # full frozen list, EMA weights
val_subset_fraction: 0.25            # fraction of val list used for mid-run subset vals
save_best_on_subset: true            # mid-run EMA insurance snapshots
