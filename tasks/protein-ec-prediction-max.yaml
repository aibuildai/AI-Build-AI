# Protein EC number prediction, for the V2.5 (Max) edition.
# Run with:  aibuildai run tasks/protein-ec-prediction-max.yaml

run:
  task_name: protein-ec-prediction
  # Point data_root directly at the folder holding the task's data files —
  # for this example, the absolute path of data/protein-ec-prediction in this repo.
  data_root: /path/to/data
  playground_root: /path/to/playground
  # The task statement, verbatim from tasks/protein-ec-prediction.md.
  instruction: |
    # Protein EC Number Prediction

    ## Task

    Multi-class classification: given a protein amino acid sequence, predict its EC (Enzyme Commission) class. The label is the top-level EC class (a single digit from 1–7):

    - **1** — Oxidoreductases
    - **2** — Transferases
    - **3** — Hydrolases
    - **4** — Lyases
    - **5** — Isomerases
    - **6** — Ligases
    - **7** — Translocases

    ## Data

    - `train.csv` — 6,444 labeled proteins. Columns: `Entry`, `EC class`, `Sequence`. The `EC class` column already contains the single-digit class label (1–7).
    - `test.csv` — 1,313 unlabeled proteins. Columns: `ID`, `Sequences`
    - `sample_submission.csv` — submission format. Columns: `ID`, `label`

    Class distribution in train:

    | Class | Count | Description      |
    |-------|-------|------------------|
    | 1     | 916   | Oxidoreductases  |
    | 2     | 2,544 | Transferases     |
    | 3     | 1,905 | Hydrolases       |
    | 4     | 457   | Lyases           |
    | 5     | 271   | Isomerases       |
    | 6     | 203   | Ligases          |
    | 7     | 148   | Translocases     |

    ## Output

    Produce `submission.csv` with columns:
    - **ID**: must match the `ID` column in `test.csv`
    - **label**: predicted first-level EC class (integer in {1, 2, 3, 4, 5, 6, 7})

    ## Metric

    **F1-score (macro)** across all 7 classes. Each unique first-level EC class is treated as a separate class. Higher is better.

llm:
  model: claude-opus-5

search:
  parallel: 2

budget:
  pipeline_budget_minutes: 90
  min_run_budget_minutes: 15
  max_run_budget_minutes: 30
  run_budget_scale: 2
  # Defaults are 40 / 90, sized for the 1440-minute default pipeline; at 90
  # minutes the stock aggregator reserve would claim the entire run.
  phase_a_budget_minutes: 20
  aggregator_reserve_cap_min_minutes: 20

training:
  min_minutes: 20
  max_minutes: 30
  slack_fraction: 0.3

resources:
  per_candidate:
    cpu_cores: 16
    rss_target_gb: 32
  gpu:
    min_free_mib: 8192
    busy_util_threshold: 90
